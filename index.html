<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>PlateLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Today</h1>
  <span id="subtitle" class="muted"></span>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" class="on"><span class="ico">◉</span>Today</button>
  <button data-tab="history"><span class="ico">▤</span>History</button>
  <button data-tab="weight"><span class="ico">⚖</span>Weight</button>
  <button data-tab="settings"><span class="ico">⚙</span>Settings</button>
</nav>

<!-- Full-screen sheet used for analysing and reviewing a meal -->
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>

<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="gallery" type="file" accept="image/*" hidden>
<input id="importFile" type="file" accept="application/json" hidden>

<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
